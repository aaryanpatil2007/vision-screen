[project]
name = "visionscreen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    # Learned perception. torch is the segmentation backbone; scikit-learn
    # carries the anaemia model, which is deliberately not a neural net.
    "torch>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    # Reads the CP-AnemiC label spreadsheet.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-subtests>=0.12",
    "httpx>=0.27",
    "httpx2>=0.1",          # starlette's TestClient requires it
    "scikit-image>=0.23",
    "playwright>=1.44",     # browser tests run the real front end
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full end-to-end battery runs (minutes)"]
